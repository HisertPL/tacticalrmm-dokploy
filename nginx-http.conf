map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name api-rmm.hisert.it;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 300M;

    location / {
        set $api tactical-backend:8080;
        include uwsgi_params;
        uwsgi_pass $api;
    }

    location /static/ {
        root /opt/tactical/api/;
        add_header Access-Control-Allow-Origin "https://rmm.hisert.it";
    }

    location /private/ {
        internal;
        alias /opt/tactical/api/tacticalrmm/private/;
        add_header Access-Control-Allow-Origin "https://rmm.hisert.it";
    }

    location /assets/ {
        internal;
        alias /opt/tactical/reporting/assets/;
        add_header Access-Control-Allow-Origin "https://rmm.hisert.it";
    }

    location ~ ^/ws/ {
        set $websockets http://tactical-websockets:8383;
        proxy_pass $websockets;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location ~ ^/natsws {
        set $nats http://tactical-nats:9235;
        proxy_pass $nats;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}

server {
    listen 8080;
    server_name rmm.hisert.it;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $frontend http://tactical-frontend:8080;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}

server {
    listen 8080;
    server_name mesh-rmm.hisert.it;
    resolver 127.0.0.11 valid=30s ipv6=off;
    proxy_send_timeout 330s;
    proxy_read_timeout 330s;

    location / {
        set $mesh http://tactical-meshcentral:4443;
        proxy_pass $mesh;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}
